name: release

# One tag versions everything: vX.Y.Z publishes image X.Y.Z and chart X.Y.Z
# (whose appVersion, and so default image tag, is also X.Y.Z). See
# docs/releasing.md.
#
# Two entry points:
# - workflow_call from auto-release.yml, after it tags a merge to main. Needed
#   because a tag pushed with GITHUB_TOKEN never triggers another workflow.
# - a tag pushed by hand (e.g. a pre-release like v0.3.0-rc.1).
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true
        type: string

permissions: {}

# Never cancel a release halfway: a chart could end up pushed without its
# GitHub Release, or an image without its chart.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Literal, not github.repository_owner: GHCR refs must be lowercase.
  REGISTRY: ghcr.io/rafaelpissolatto
  IMAGE: ghcr.io/rafaelpissolatto/kubelynx
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest is set explicitly below, so pre-releases never move it.
          flavor: latest=false
          # {{major}}.{{minor}} is skipped for pre-release versions.
          # value= because under workflow_call github.ref is main, not the tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kubelynx
          cache-to: type=gha,mode=max,scope=kubelynx

  # Runs only after the image is pushed, so a published chart never points at
  # a missing image.
  chart-publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Package chart
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          make lint-chart
          helm package charts/kubelynx --version "$VERSION" --app-version "$VERSION" --destination dist/
      - name: Push chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kubelynx-$VERSION.tgz" "oci://$REGISTRY/charts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: dist/kubelynx-${{ env.VERSION }}.tgz
          if-no-files-found: error

  github-release:
    needs: chart-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/*.tgz \
            --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
