image:
  repository: ghcr.io/rafaelpissolatto/kubelynx
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

prometheus:
  # Base URL of the Prometheus (or Thanos/Mimir) HTTP API holding Beyla's
  # beyla_network_flow_bytes_total metric. Required.
  url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  bearerToken:
    # Optional. Name of an existing Secret in the release namespace holding a
    # bearer token for Prometheus. It's mounted as a file and re-read on every
    # request, so rotating the Secret needs no restart. Leave empty for no auth.
    #   kubectl create secret generic prom-token --from-literal=token=<token>
    existingSecret:
      name: ""
      key: token
  basicAuth:
    # Optional HTTP Basic auth (OpenObserve, Grafana Cloud, Prometheus behind
    # an auth gateway). Set both username and existingSecret.name, or neither;
    # can't be combined with bearerToken. The password is mounted from an
    # existing Secret in the release namespace and re-read on every request,
    # so rotating the Secret needs no restart. The chart never creates it:
    #   kubectl create secret generic prom-basic-auth --from-file=password=./password
    username: ""
    existingSecret:
      name: ""
      key: password

# How often the UI polls for fresh topology (a Go duration, e.g. 15s, 1m).
refreshInterval: 15s

# When the UI's namespace picker shows a non-blocking "large graphs may render
# slowly" warning (--namespace-warn-threshold): once at least this many
# namespaces from different prefix groups are selected (the group is the part
# before the first "-", so team-a-dev and team-b-prod are one group), or
# "All namespaces" on a cluster with at least this many. A whole number;
# 0 turns the warning off. Selections are never capped.
namespaceWarnThreshold: 6

# Port-cardinality and protocol-filter tuning. Both are optional; leave them
# empty to keep the binary's built-in defaults. Each one is rendered into a
# chart-managed ConfigMap (plain, non-secret data), mounted as a directory and
# passed to the matching flag. The binary reads these files once at startup, so
# the pod restarts automatically when they change. A set key replaces that
# list wholesale (it doesn't merge with the defaults). Ports are strings in
# the files; unquoted YAML numbers are converted for you.
cardinality:
  # TCP ports that keep their own edge (--tcp-port-allowlist-file); other TCP
  # ports, and UDP ports other than 53, collapse into one "multiple" edge.
  # Only the key "tcp" is accepted. Example:
  #   tcpPortAllowlist:
  #     tcp: ["80", "443", "8080", "5432"]
  tcpPortAllowlist: {}
protocol:
  # Destination ports counted as HTTP and as gRPC by the protocol filter
  # (--protocol-ports-file). Only the keys "http" and "grpc" are accepted; a
  # key you omit ends up with no ports. Example:
  #   ports:
  #     http: ["80", "8081"]
  #     grpc: ["50052"]
  ports: {}

# Extra flags appended to the kubelynx command line. An escape hatch for flags
# the chart doesn't expose yet. The port files above have their own values;
# other file-based flags would also need a volume the chart can't add.
extraArgs: []

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
