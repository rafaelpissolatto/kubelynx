# kubelynx.localhost -> the in-cluster KubeLynx (charts/kubelynx). No
# namespace here: `make deploy-kubelynx` applies it into KUBELYNX_NAMESPACE,
# next to the Service. Needs the gateway (`make deploy-gateway`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubelynx
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames: ["kubelynx.localhost"]
  rules:
    - backendRefs:
        - name: kubelynx
          port: 80
