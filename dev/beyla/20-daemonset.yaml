apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beyla
    spec:
      serviceAccountName: beyla
      # Beyla's network feature captures flows off the host's network
      # interfaces; without hostNetwork it only ever sees its own pod's
      # eth0. hostPID lets it resolve traffic back to host processes/pods.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        # Pinned version doubles as this dev cluster's tested-against Beyla
        # baseline.
        - name: beyla
          image: grafana/beyla:3.28.0
          securityContext:
            privileged: true
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: BEYLA_CONFIG_PATH
              value: /config/beyla-config.yml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: var-run-beyla
              mountPath: /var/run/beyla
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: beyla-config
        - name: var-run-beyla
          emptyDir: {}
