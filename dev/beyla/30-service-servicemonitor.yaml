apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: beyla
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
