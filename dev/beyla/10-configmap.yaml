apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
data:
  beyla-config.yml: |
    attributes:
      kubernetes:
        enable: true
        # Cosmetic label only (not used for ServiceMonitor discovery or
        # querying) — intentionally not wired to the Makefile's
        # overridable CLUSTER_NAME.
        cluster_name: kubelynx-dev
      # KubeLynx's spec requires owner name/type, namespace, transport
      # (protocol), destination port, and direction on every flow series.
      # None of these are in Beyla's default attribute set except owner.name
      # and namespace, so they're selected explicitly here.
      # Keep this list in sync with REQUIRED_LABELS in
      # dev/scripts/validate.sh (dotted names here become underscored
      # Prometheus label names there, e.g. k8s.src.owner.name -> k8s_src_owner_name).
      select:
        beyla_network_flow_bytes:
          include:
            - k8s.src.owner.name
            - k8s.src.namespace
            - k8s.src.owner.type
            - k8s.dst.owner.name
            - k8s.dst.namespace
            - k8s.dst.owner.type
            - transport
            - dst.port
            - direction

    # Bounds dst.port cardinality. On reply traffic, dst.port is the client's
    # ephemeral port, so every connection otherwise mints new series (~99% of
    # beyla_network_flow_bytes series and ~18.7k new series/hour in the dev
    # cluster). Only flows to a port below Linux's default ephemeral range
    # (32768, see net.ipv4.ip_local_port_range) or to a listed high server
    # port are kept; the rest are dropped, not aggregated.
    #
    # Trade-off: dropped flows are mostly response payloads, so byte rates
    # reflect the request direction only (~15% of raw bytes in the dev
    # cluster). Clusters that widen ip_local_port_range, or serve on other
    # ports >= 32768, must adjust the pattern. One glob (gobwas/glob) is used
    # instead of `less_than: 32768` because a single attribute can't combine a
    # numeric bound with a list: the pattern reads "any 1-4 digit port, or
    # 10000-32767, or 50051 (gRPC)".
    filter:
      network:
        dst_port:
          match: "{?,??,???,????,[12]????,3[01]???,32[0-6]??,327[0-5]?,3276[0-7],50051}"

    # Network-only: KubeLynx doesn't consume Beyla's application/HTTP
    # instrumentation, so there's no `discovery.services` scoping and no
    # `application` feature below — just L3/L4 flow capture.
    network:
      enable: true

    prometheus_export:
      port: 9090
      path: /metrics
      features:
        - network
