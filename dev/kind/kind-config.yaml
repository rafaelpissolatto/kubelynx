# One control plane + two workers, so demo traffic crosses node boundaries.
#
# Host ports @HTTP_PORT@/@HTTPS_PORT@ (80/443 by default; `make cluster`
# fills them in from GATEWAY_HTTP_PORT/GATEWAY_HTTPS_PORT) map to NodePorts
# 30080/30443 on the control-plane node: the NGINX Gateway Fabric data
# plane's HTTP and HTTPS listeners (dev/gateway/).
#
# kind only applies port mappings when it creates a cluster, so changing
# them requires `make clean setup`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: @HTTP_PORT@
        protocol: TCP
      - containerPort: 30443
        hostPort: @HTTPS_PORT@
        protocol: TCP
  - role: worker
  - role: worker
